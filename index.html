<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menyusun Kata Aksara Jawa - Tetris Word Building</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>

    <header class="app-header">
        <h1 class="app-title-aksara">ꦒꦩꦼꦱ꧀ꦪꦸꦱꦸꦤ꧀ꦏꦠꦄꦏ꧀ꦱꦫꦗꦮ</h1>
        <div class="app-title-latin">Word Building Game • Aksara Jawa</div>
    </header>

    <main class="game-container">
        
        <section class="panel target-panel">
            <h2 class="panel-title">🎯 Target Kata</h2>
            <ul id="target-word-list" class="word-list">
            </ul>
        </section>

        <section class="panel board-panel">
            <div id="tetris-area">
            </div>

            <div class="mobile-controls">
                <button id="touch-left" class="touch-btn">◀</button>
                <button id="touch-swap" class="touch-btn">🔄</button>
                <button id="touch-right" class="touch-btn">▶</button>
                <button id="touch-down" class="touch-btn">▼</button>
                <button id="touch-drop" class="touch-btn">⚡ DROP</button>
            </div>
        </section>

        <section class="panel stats-panel">
            <div class="stat-box">
                <div class="stat-label">Skor</div>
                <div id="stat-score" class="stat-value">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div id="stat-level" class="stat-value">1</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Kata Tertebak</div>
                <div id="stat-words" class="stat-value">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Balok Berikutnya</div>
                <div id="next-puzzle-box">
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-start" class="btn">▶ Mulai Game</button>
                <button id="btn-pause" class="btn btn-secondary">⏸ Pause</button>
                <button id="btn-reset" class="btn btn-secondary">↺ Reset</button>
                <button id="btn-json" class="btn btn-secondary">⚙️ Kelola tetris.json</button>
            </div>
        </section>

    </main>

    <div id="json-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">⚙️ Editor Data Kata (tetris.json)</h3>
            <p style="font-size: 0.85rem; margin-bottom: 10px; color: var(--gold-light);">
                Anda dapat menambah, mengubah, atau memperbarui kata target di bawah ini. Pastikan format JSON tetap valid.
            </p>
            <textarea id="json-editor-textarea"></textarea>
            <div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;">
                <button id="btn-download-json" class="btn btn-secondary">💾 Unduh tetris.json</button>
                <button id="btn-save-json" class="btn">✓ Simpan & Terapkan</button>
                <button id="btn-close-json" class="btn btn-secondary">Tutup</button>
            </div>
        </div>
    </div>

    <script src="kbj.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
